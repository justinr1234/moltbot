[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
stdout_logfile=/var/log/molt/sshd.log
stderr_logfile=/var/log/molt/sshd.err
priority=100

[program:fail2ban]
command=/usr/bin/fail2ban-server -f
autostart=true
autorestart=true
stdout_logfile=/var/log/molt/fail2ban.log
stderr_logfile=/var/log/molt/fail2ban.err
priority=50

[program:rsyslog]
command=/usr/sbin/rsyslogd -n
autostart=true
autorestart=true
stdout_logfile=/var/log/molt/rsyslog.log
stderr_logfile=/var/log/molt/rsyslog.err
priority=10

[program:webui]
command=serve -s /var/www -l 8080
user=molt
autostart=true
autorestart=true
stdout_logfile=/var/log/molt/webui.log
stderr_logfile=/var/log/molt/webui.err
priority=200
