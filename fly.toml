# Base fly.toml for molt VMs
# This is a template - each molt gets its own derived config

app = "molt-base"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  MOLT_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "molt_data"
  destination = "/home/molt"
